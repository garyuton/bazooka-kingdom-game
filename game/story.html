<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="バズーカ王国物語 ノベルゲーム画面">
  <title>物語｜バズーカ王国物語</title>
  <link rel="stylesheet" href="story.css?v=20260716-second-act">
</head>
<body>
  <main id="novel-game" class="novel-game" aria-label="ノベルゲーム">
    <!-- 背景と立ち絵を別レイヤーにし、個別に差し替えられる構造です。 -->
    <div id="background-layer" class="background-layer" aria-hidden="true"></div>
    <div id="background-crossfade" class="background-crossfade" aria-hidden="true"></div>
    <div id="background-placeholder" class="background-placeholder" aria-hidden="true">
      <span>BAZOOKA KINGDOM</span>
    </div>
    <div id="book-transition" class="book-transition" aria-hidden="true">
      <div id="book-transition-closed" class="book-transition__image book-transition__image--closed"></div>
      <div id="book-transition-open" class="book-transition__image book-transition__image--open"></div>
    </div>

    <div id="character-layer" class="character-layer" aria-hidden="true">
      <img id="character-left" class="character character--left" alt="">
      <img id="character-center" class="character character--center" alt="">
      <img id="character-right" class="character character--right" alt="">
      <div id="character-placeholder" class="character-placeholder">
        <span class="placeholder-crown">♛</span>
        <span class="placeholder-face">●</span>
        <span id="character-placeholder-name" class="placeholder-name"></span>
      </div>
    </div>

    <div id="scene-effect" class="scene-effect" aria-hidden="true"></div>

    <div id="scene-fader" class="scene-fader" aria-hidden="true"></div>

    <header class="game-controls">
      <button id="back-button" class="control-button" type="button">タイトルへ戻る</button>
    </header>

    <!-- 画面の余白を含む舞台全体をタップ領域にします。 -->
    <button id="advance-layer" class="advance-layer" type="button" aria-label="セリフを進める">
      <section class="dialogue-panel is-hidden" aria-live="polite">
        <img id="narrator-icon" class="narrator-icon" alt="">
        <p id="speaker-name" class="speaker-name"></p>
        <p id="dialogue-text" class="dialogue-text">シナリオを読み込んでいます…</p>
        <span class="advance-mark" aria-hidden="true">▼</span>
      </section>
    </button>

    <p id="error-message" class="error-message" role="alert"></p>

    <section id="name-entry" class="modal-overlay" hidden aria-labelledby="name-entry-title">
      <form id="name-entry-form" class="modal-card">
        <h2 id="name-entry-title">あなたの名前を入力してください</h2>
        <input id="player-name-input" name="playerName" type="text" value="ガリュウ" maxlength="12" autocomplete="off" required>
        <button type="submit">決定</button>
      </form>
    </section>

    <section id="chapter-end" class="chapter-end" hidden aria-labelledby="chapter-end-title">
      <div class="chapter-end__card">
        <h2 id="chapter-end-title">第一章 完</h2>
        <p>次章へつづく</p>
        <button id="chapter-end-back" type="button">タイトルへ戻る</button>
        <small>第二章は未実装です</small>
      </div>
    </section>

    <section id="ending-roll" class="ending-roll" hidden aria-live="polite" aria-label="第一章エンディング">
      <div id="ending-visual" class="ending-roll__visual" aria-hidden="true"></div>
      <div id="ending-glow" class="ending-roll__glow" aria-hidden="true"></div>
      <div id="ending-content" class="ending-roll__content"></div>
      <button id="ending-skip" class="ending-roll__skip" type="button" hidden>SKIP</button>
    </section>
  </main>

  <script src="story.js?v=20260716-second-act"></script>
</body>
</html>
